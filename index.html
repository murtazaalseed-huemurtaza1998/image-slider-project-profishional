<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACTICAL GALLERY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="title">
        <span class="icon">👁</span>
        <span>TACTICAL GALLERY</span>
    </div>
    <div class="counter" id="slide-number">01 / 10</div>
</div>

<div class="slider-container">
    <div class="slide-number" id="slide-number-top">Slide 1 / 10</div>

    <!-- 10 صور بدون نت - صور SVG ملونة -->
    <img src="item1.jpg" class="active" alt="Slide 1">
    <img src="item2.jpg" alt="Slide 2">
    <img src="item3.jpg" alt="Slide 3">
    <img src="item4.jpg" alt="Slide 4">
    <img src="item5.jpg" alt="Slide 5">
    <img src="item6.jpg" alt="Slide 6">
    <img src="item7.jpg" alt="Slide 7">
    <img src="item8.jpg" alt="Slide 8">
    <img src="item9.jpg" alt="Slide 9">
    <img src="item10.jpg" alt="Slide 10">

    
    
    <div class="arrow prev-arrow">></div>  <!-- السابق -->
<div class="arrow next-arrow"><</div>  <!-- التالي -->
</div>

<div class="slider-controls">
    <div class="buttons">
        <button class="prev" id="prev">Previous</button>
        <button class="play-pause" id="play-pause">Pause</button>
        <button class="next" id="next">Next</button>
    </div>
    <div class="indicators" id="indicators"></div>
    <div class="thumbnails" id="thumbnails"></div>
</div>

<div class="footer-info">
    TACTICAL GALLERY <br>
    © 2024 | Use arrow keys or swipe to navigate
</div>

<script src="main.js"></script>
</body>
</html>
